# Ooh, big fancy config doing a lot of very big fancy things! Waaaaah!!!

opacity-rule = [ 
	"95:class_g = 'dmenu'"
];

backend = "glx";
# This basically amounts to disabling the compositor
# completely when a singular window covers the entire screen.
unredir-if-possible = true;

blur-method = "dual_kawase";
blur-strength = 1;

shadow-exclude = [
	"window_type = 'menu'",
	"window_type = 'dropdown_menu'",
	"window_type = 'popup_menu'",
	"window_type = 'tooltip'",
	"window_type = 'utility'",
];

blur-background-exclude = [
	"window_type = 'menu'",
	"window_type = 'dropdown_menu'",
	"window_type = 'popup_menu'",
	"window_type = 'tooltip'",
	"window_type = 'utility'",
];
